name: Bug report
description: Report an error in the Global-Merit-Chain specification, schemas, test vectors, reference code, or documentation.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a problem in Global-Merit-Chain.
        Please do not report security vulnerabilities here; follow [SECURITY.md](https://github.com/ChainMode/Global-Merit-Chain/blob/main/SECURITY.md) to report them privately.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong? Quote the relevant section, file, or field if possible.
      placeholder: A clear and concise description of the problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we see the problem? Include commands, inputs, or links to the affected document.
      placeholder: |
        1. Open '...'
        2. Run '...'
        3. See '...'
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen or to read instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Specification edition, package version, or commit SHA you are using.
      placeholder: e.g. 1.0, 2025-10-25, or a commit SHA
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Environment details, logs, screenshots, or anything else that helps.
    validations:
      required: false

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](https://github.com/ChainMode/Global-Merit-Chain/blob/main/CODE_OF_CONDUCT.md).
          required: true
